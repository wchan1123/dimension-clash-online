<div id="topbar" class="panel"><div class="row"><h1>✦ 차원대충돌! 3D</h1><span id="roundInfo">게임 대기 중</span></div><div class="row"><button class="secondary" id="copy">초대 링크</button><button class="secondary" id="flat">2D로 돌아가기</button></div></div>

<div id="bigCard"><span id="bigLabel"></span><div id="bigArt"></div></div><div id="cardInspection"><div class="dialog"><strong id="inspectionName"></strong><div class="art" id="inspectionArt"></div><button id="inspectionUse">선택한 카드 사용</button><button class="secondary" id="inspectionClose">닫기</button></div></div>
<div id="response" class="panel"></div>
<div id="bottom"><div id="hand"></div><div id="actions"><button id="draw" class="primary">✦ 덱 · 1장 뽑기</button><button id="next">턴 종료 ❯</button><button id="viewCard">카드 자세히</button><button id="field">◈ 필드 교체</button><button id="grave">묘지로 보내기</button><button id="win">✦ 아마겟돈!</button></div></div>
<div id="lobby" class="panel"><h2>✦ 우주 테이블 로비</h2><p class="muted">WASD로 돌아다니다가 테이블에 앉아 카드게임을 시작하세요. 혼자라면 AI를 추가할 수 있어요.</p><label>닉네임</label><input id="name" placeholder="플레이어 이름" maxlength="20"><button id="create">새 게임방 만들기</button><label>6자리 방 코드</label><input id="roomcode" placeholder="예: AB1234"><button id="join">방 입장</button><div id="settings" style="display:none"><label>총 바퀴</label><input id="rounds" value="5" type="number" min="1" max="100"><button id="saveRounds">설정</button><label>AI</label><select id="botCount"><option value="1">1명</option><option value="2">2명</option><option value="3">3명</option></select><button id="addBot">AI 추가</button><button id="removeBot" class="secondary">AI 제거</button><button id="start" class="primary">게임 시작</button><button id="exitLobby" class="secondary">테이블 둘러보기</button></div></div>
</div><script src="/socket.io/socket.io.js"></script><script type="module">
import * as THREE from '/vendor/three.module.js';

box(0,-.12,0,40,.2,40,0x21182d);

for(let i=0;i<0;i++){const a=i*Math.PI/4,x=Math.sin(a)*4.4,z=Math.cos(a)*4.4;const chair=mesh(new THREE.BoxGeometry(.95,.18,.95),0x543866);chair.position.set(x,.75,z);chair.rotation.y=a;scene.add(chair);const back=mesh(new THREE.BoxGeometry(1.05,1.05,.18),0x644776);back.position.set(Math.sin(a)*4.9,1.25,Math.cos(a)*4.9);back.rotation.y=a;scene.add(back);}

function send(event,data={}){socket.emit(event,data,r=>{if(!r?.ok){$('notice').textContent='⚠ '+r?.error;return}if((event==='create'||event==='join')&&r?.code){persist(r,$('name').value);$('notice').textContent='입장 완료 · 테이블로 이동할 수 있어요'}else if(event!=='avatar')$('notice').textContent='✓ '+event+' 처리 완료'})}
function cardStyle(id){const n=Number(id)-1;return 'background-image:url(/sheets/'+String(Math.ceil(Number(id)/9)).padStart(2,'0')+'.png);background-position:'+([5.78,50,94.2][n%3])+'% '+([6.94,50,93.08][Math.floor(n%9/3)])+'%;';}

$('inspectionClose').onclick=()=>$('cardInspection').classList.remove('open');$('inspectionUse').onclick=()=>{const id=selected;$('cardInspection').classList.remove('open');if(id)playSelected(id)};
function large(card,player='카드 사용'){if(!card)return;$('bigLabel').textContent=player+' · '+card.name;$('bigArt').style.cssText=cardStyle(card.id);$('bigCard').classList.add('show');clearTimeout(large.timer);large.timer=setTimeout(()=>$('bigCard').classList.remove('show'),5000)}
function avatar(p){let animator=avatars.get(p.id);if(!animator){animator=makeHuman(scene,p);avatars.set(p.id,animator)}animator.p=p;animator.g.position.set(p.x,0,p.z);animator.g.rotation.y=p.angle||0;}
function seatPosition(){const n=state?.players.findIndex(p=>p.id===state.me)??0;const a=n*2*Math.PI/Math.max(2,state?.players.length||2);return {x:Math.sin(a)*4.4,z:Math.cos(a)*4.4,angle:a}}
function render(){if(!state)return;
 $('status').innerHTML='<b>✦ 테이블 참가자</b>'+state.players.map((p,i)=>'<div class="user">'+(i===state.turn?'🟢 ':'')+(p.bot?'🤖 ':'')+esc(p.name)+(p.id===state.me?' (나)':'')+' · 손패 '+p.count+' · 함정 '+p.traps+'</div>').join('');
 $('roundInfo').textContent=(state.status==='playing'?'남은 바퀴 '+state.left+'/'+state.rounds+' · '+state.players[state.turn]?.name+' 차례':state.status==='finished'?'게임 종료':'대기실 · '+(state.code||''));
 $('settings').style.display=state.status==='lobby'?'flex':'none';$('lobby').classList.toggle('hidden',state.status!=='lobby');
 $('start').disabled=state.owner!==state.me;$('addBot').disabled=state.owner!==state.me;$('removeBot').disabled=state.owner!==state.me;
 $('saveRounds').disabled=state.owner!==state.me;
 const old=selected;$('hand').replaceChildren();
 for(const c of state.hand){const div=document.createElement('button');div.className='card';div.title=c.name;div.draggable=true;div.dataset.id=c.id;div.style.cssText=cardStyle(c.id);if(c.id===old)div.classList.add('selected');div.onclick=()=>{selected=c.id;render();};div.ondblclick=()=>inspect(c);div.ondragstart=e=>{draggingId=c.id;e.dataTransfer.setData('text/plain',c.id);};$('hand').appendChild(div)}
 $('draw').disabled=state.status!=='playing'||state.players[state.turn]?.id!==state.me||!!state.turnAction||!!state.pending;$('next').disabled=state.status!=='playing'||state.players[state.turn]?.id!==state.me;$('win').disabled=state.hand.length<10;
 const trap=state.myTraps||[];
 for(const p of state.players){avatar(p);if(p.id===state.me){me.seat=p.seated;if(!me.ready){me.x=p.x;me.z=p.z;me.ready=true}}}
 if(state.actionEvent&&state.actionEvent.id!==lastActionId){lastActionId=state.actionEvent.id;showAction(state.actionEvent)}
 if(state.showcase && state.showcase.at!==latestShow){latestShow=state.showcase.at;const c=state.catalog.find(x=>x.id===state.showcase.cardId);large(c,state.showcase.actorName+(state.showcase.kind==='trap'?' 함정 발동':' 카드 사용'));}
 refreshBoard(board3d,state,originalBack);
 renderTrapControls();
 drawReactions();
}
function renderTrapControls(){const box=$('trapInfo');box.replaceChildren();if(!state)return;const title=document.createElement('strong');title.textContent='✦ 내 설치 함정 · '+state.myTraps.length+'장';box.appendChild(title);for(const c of state.myTraps){const b=document.createElement('button');b.className='trap-chip';b.title=c.name+' · 조건이 맞으면 발동';b.textContent='▣ '+c.name+' · 발동';b.onclick=()=>{if(confirm(c.name+'의 원본 발동 조건이 실제로 충족됐나요?'))send('triggerTrap',{cardId:c.id})};box.appendChild(b)}if(state.trapReveal?.ownerId===state.me){const b=document.createElement('button');b.className='trap-complete';b.textContent='✓ 함정 처리 완료 → 묘지';b.onclick=()=>send('finishTrap');box.appendChild(b)}}

function showAction(action){
 const box=$('actionCaption');box.textContent='✦ '+action.label;box.classList.remove('hidden');
 spotlightActorId=action.actorId;spotlightUntil=performance.now()+3200;
 const actor=avatars.get(action.actorId),target=avatars.get(action.targetId);
 if(actor){actor.pointUntil=Date.now()+2250;actor.targetPos=target?target.g.position.clone():new THREE.Vector3(0,1,0);}
 clearTimeout(showAction.timeout);showAction.timeout=setTimeout(()=>box.classList.add('hidden'),3300);
}
function beginPoint(cardId,kind='action'){
 if(!state)return;
 const c=state.hand.find(x=>x.id===cardId);
 if(!c||!['action','counter'].includes(c.type)){ $('notice').textContent='대상 지정은 행동·카운터카드에서만 가능합니다';return }
 pointing={cardId,kind};pickedTarget=null;
 $('targetPicker').classList.remove('hidden');
 $('targetHint').textContent='카드를 든 상태입니다. 상대 캐릭터를 마우스로 클릭하거나 아래에서 선택하세요.';
 renderTargets();
}
function renderTargets(){
 const list=$('targetPlayers');list.replaceChildren();
 for(const p of state.players.filter(p=>p.id!==state.me)){
  const btn=document.createElement('button');btn.textContent='☞ '+p.name;
  btn.className='target-option'+(pickedTarget===p.id?' picked':'');
  btn.onclick=()=>{pickedTarget=p.id;renderTargets();highlightTarget(p.id)};
  list.appendChild(btn);
 }
 $('targetConfirm').disabled=!pickedTarget;
}
function highlightTarget(id){
 for(const [pid,a] of avatars){a.g.traverse(o=>{if(o.isMesh&&o.material?.emissive)o.material.emissive.setHex(pid===id?0x173e30:0x000000)})}
}
function clearPoint(){pointing=null;pickedTarget=null;$('targetPicker').classList.add('hidden');highlightTarget(null)}
$('targetCancel').onclick=clearPoint;
$('targetConfirm').onclick=()=>{
 if(!pointing||!pickedTarget)return;
 const {cardId,kind}=pointing;
 const targetId=pickedTarget;
 if(kind==='counter'){send('react',{choice:'counter',cardId,targetId});}
 else send('announce',{cardId,targetId});
 clearPoint();
};
$('view').addEventListener('pointerdown',e=>{
 if(!pointing||!state)return;
 const rect=$('view').getBoundingClientRect();
 pointer.set(((e.clientX-rect.left)/rect.width)*2-1,-((e.clientY-rect.top)/rect.height)*2+1);
 ray.setFromCamera(pointer,camera);
 const candidates=[...avatars.values()].filter(a=>a.id!==state.me);
 for(const entry of ray.intersectObjects(candidates.map(a=>a.g),true)){
   let obj=entry.object;while(obj.parent&&!candidates.some(a=>a.g===obj))obj=obj.parent;
   const target=candidates.find(a=>a.g===obj);
   if(target){pickedTarget=target.id;renderTargets();highlightTarget(target.id);$('notice').textContent=target.p.name+'님을 가리키고 있습니다';break}
 }
});
function esc(s){return String(s).replace(/[&<>"]/g,t=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[t]))}
function drawReactions(){const w=state?.pending,r=$('response');r.classList.toggle('show',!!w);if(!w)return;r.replaceChildren();const title=document.createElement('b');title.textContent='⚡ '+w.stack?.at(-1)?.cardName+' 대응';r.appendChild(title);const p=document.createElement('p');p.className='muted';const priority=w.stage==='responding'?w.order[w.cursor]:null;p.textContent=w.stage==='ready'?'카드 효과 처리 대기':state.players.find(x=>x.id===priority)?.name+'님의 대응 순서';r.appendChild(p);
function button(label,cb){const b=document.createElement('button');b.textContent=label;b.onclick=cb;r.appendChild(b)}
if(w.stage==='responding'&&priority===state.me){button('반응 없음 · 패스',()=>send('react',{choice:'pass'}));if(state.hand.some(c=>c.type==='counter')){const select=document.createElement('select');select.id='counterChoice';for(const c of state.hand.filter(c=>c.type==='counter')){const o=document.createElement('option');o.value=c.id;o.textContent=c.name;select.appendChild(o)}r.appendChild(select);button('☞ 상대를 가리켜 카운터 사용',()=>beginPoint(select.value,'counter'))}}
if(w.stage==='ready'&&w.stack.at(-1)?.actorId===state.me)button('효과 확인 후 해결',()=>send('resolve'));
}
socket.on('connect',()=>{const session=saved();if(session){$('name').value=session.name;socket.emit('join',session,res=>{if(res?.ok)persist(res,session.name);else $('notice').textContent='기존 방 재접속 실패 · 새 방을 만들거나 입장하세요'})}});
socket.on('state',s=>{state=s;currentCode=s.code;render()});
socket.on('avatar',p=>{const a=avatars.get(p.id);if(a){a.g.position.set(p.x,0,p.z);a.g.rotation.y=p.angle}});
socket.on('cursor',p=>{if(p.id===state?.me)return;let v=$('cursor_'+p.id);if(!v){v=document.createElement('div');v.id='cursor_'+p.id;v.className='cursor';$('cursors').appendChild(v)}v.textContent='↖ '+p.name;v.style.left=(p.x*100)+'%';v.style.top=(p.y*100)+'%'});
$('create').onclick=()=>send('create',{name:$('name').value});$('join').onclick=()=>send('join',{code:$('roomcode').value,name:$('name').value});
$('roomcode').value=new URLSearchParams(location.search).get('room')||'';$('copy').onclick=()=>navigator.clipboard.writeText(location.origin+'/room3d.html?room='+currentCode).then(()=>$('notice').textContent='초대 링크 복사 완료');
$('saveRounds').onclick=()=>send('rounds',{count:+$('rounds').value});$('addBot').onclick=()=>send('addBot',{count:+$('botCount').value});$('removeBot').onclick=()=>send('removeBot');
$('start').onclick=()=>send('start');$('exitLobby').onclick=()=>$('lobby').classList.add('hidden');$('flat').onclick=()=>location.href='/?room='+(currentCode||'');
$('draw').onclick=()=>send('draw',{count:1});$('next').onclick=()=>send('next');$('win').onclick=()=>send('declare');
$('viewCard').onclick=()=>inspect(state?.hand.find(x=>x.id===selected));
$('field').onclick=()=>moveSelected('field');$('grave').onclick=()=>moveSelected('discard');
function moveSelected(destination){if(!selected)return $('notice').textContent='손패를 먼저 선택하세요';const c=state.hand.find(x=>x.id===selected);if(destination==='field'&&c.type!=='field')return $('notice').textContent='필드에는 필드카드만 둘 수 있습니다';if(destination==='trap'&&c.type!=='trap')return $('notice').textContent='함정 구역에는 함정카드만 둘 수 있습니다';send('move',{cardId:selected,destination});selected=null}
function playSelected(id){const c=state?.hand.find(x=>x.id===id);if(!c)return;selected=id;if(c.type==='field')return moveSelected('field');if(c.type==='trap')return moveSelected('trap');if(c.type==='action')return beginPoint(id,'action');if(c.type==='counter')return beginPoint(id,'counter');$('notice').textContent='이 카드 종류는 직접 사용할 수 없습니다';}
for(const z of document.querySelectorAll('.zone')){z.ondragover=e=>{e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');z.ondrop=e=>{e.preventDefault();z.classList.remove('over');const id=e.dataTransfer.getData('text/plain')||draggingId;selected=id;if(z.dataset.zone==='trap')moveSelected('trap');else playSelected(id)};z.onclick=()=>{if(z.dataset.zone==='trap')moveSelected('trap');else if(selected)playSelected(selected)}}
function toggleSeat(){if(!state)return;const pos=seatPosition();if(me.seat){send('sit',{sit:false});me.seat=false;me.x=pos.x*1.5;me.z=pos.z*1.5;return}if(Math.hypot(me.x-pos.x,me.z-pos.z)>3.4){$('notice').textContent='내 자리 쪽으로 WASD 이동한 후 E를 누르세요';return}send('sit',{sit:true});me.seat=true;me.x=pos.x;me.z=pos.z}
$('modeButton').onclick=toggleSeat;
window.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;key.add(e.key.toLowerCase());if(e.key.toLowerCase()==='e'&&!e.repeat)toggleSeat()});
window.addEventListener('keyup',e=>key.delete(e.key.toLowerCase()));
const clock=new THREE.Clock();let yaw=0;window.addEventListener('mousemove',e=>{if(e.buttons===2){yaw+=e.movementX*.004}if(state&&performance.now()-lastCursor>65){lastCursor=performance.now();socket.emit('cursor',{x:e.clientX/innerWidth,y:e.clientY/innerHeight})}});
$('view').oncontextmenu=e=>e.preventDefault();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);const dt=Math.min(.05,clock.getDelta());if(!me.seat&&state){const vx=Number(key.has('d'))-Number(key.has('a')),vz=Number(key.has('s'))-Number(key.has('w'));if(vx||vz){const len=Math.hypot(vx,vz),dx=(Math.cos(yaw)*vx-Math.sin(yaw)*vz)/len*dt*3.8,dz=(Math.sin(yaw)*vx+Math.cos(yaw)*vz)/len*dt*3.8;const nx=Math.max(-11,Math.min(11,me.x+dx)),nz=Math.max(-11,Math.min(11,me.z+dz));if(Math.hypot(nx,nz)>3.35){me.x=nx;me.z=nz}if(performance.now()-lastAvatar>90){lastAvatar=performance.now();socket.emit('avatar',{x:me.x,z:me.z,angle:yaw})}}}
 const target=new THREE.Vector3(0,1.2,0);
 if(me.seat){const focus=state?.players.find(x=>x.id===(spotlightUntil>performance.now()?spotlightActorId:state?.players[state?.turn]?.id));
  if(state?.status==='playing'&&focus){const fx=focus.x||0,fz=focus.z||0,dir=new THREE.Vector3(fx,0,fz).normalize();if(dir.lengthSq()<.01)dir.set(0,0,1);const origin=new THREE.Vector3(fx+dir.x*2.25,2.65,fz+dir.z*2.25);camera.position.lerp(origin,.065);camera.lookAt(new THREE.Vector3(fx,1.35,fz));}
  else{const pos=seatPosition();const origin=new THREE.Vector3(pos.x*1.12,2.45,pos.z*1.12);camera.position.lerp(origin,.10);camera.lookAt(target);}}
 else{const pos=new THREE.Vector3(me.x,2.2,me.z);camera.position.lerp(pos,.12);camera.lookAt(me.x+Math.sin(yaw)*4,1.75,me.z-Math.cos(yaw)*4);}
 if(state){for(const a of avatars.values()){const distance=a.previous?Math.hypot(a.g.position.x-a.previous.x,a.g.position.z-a.previous.z):0;animateHuman(a,clock.elapsedTime,distance>.01,a.p.seated);a.previous={x:a.g.position.x,z:a.g.position.z};}const p=avatars.get(state.me);if(p){p.g.position.set(me.x,0,me.z);p.g.visible=(!me.seat || state.players[state.turn]?.id===state.me)}if(originalBack.texture!==lastBackTexture){lastBackTexture=originalBack.texture;refreshBoard(board3d,state,originalBack)}}
 renderer.render(scene,camera)}
animate();
</script></body></html>
