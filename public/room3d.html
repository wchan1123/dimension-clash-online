<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>차원대충돌! 3D 테이블</title>
<style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#fff5dc;background:#11091b}
*{box-sizing:border-box}body{margin:0;overflow:hidden}#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #7de6c2;border-radius:11px;background:#7de6c2;color:#24152e;font-weight:800;padding:10px 14px;min-height:41px}button.secondary{background:#352347;color:#f7e9ff;border-color:#785993}
button:disabled{opacity:.4;cursor:not-allowed}.panel{background:#231430e8;border:1px solid #84679d;box-shadow:0 9px 32px #0b041899;border-radius:15px;padding:13px;pointer-events:auto;backdrop-filter:blur(10px)}
#topbar{position:absolute;left:16px;right:16px;top:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
#topbar .row,#status .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:18px;margin:0;color:#d5ffe5}#roundInfo{font-weight:bold;color:#a9ffde}#status{position:absolute;left:14px;top:76px;width:235px;max-height:45vh;overflow:auto}.muted{font-size:12px;color:#baaac8}#status .user{padding:6px 4px;border-bottom:1px solid #4d375e}#bottom{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:min(100%,1150px);display:grid;gap:6px;pointer-events:none}
#hand{height:182px;display:flex;align-items:end;justify-content:center;overflow-x:auto;overflow-y:visible;padding:8px 12px 15px;pointer-events:auto;touch-action:pan-x;scrollbar-width:thin}#hand .card{width:120px;min-width:120px;height:167px;margin-left:-14px;border:2px solid #7af8c2;border-radius:10px;box-shadow:0 8px 18px #0009;cursor:grab;position:relative;background-color:#4c286c;background-repeat:no-repeat;background-size:333.333% 337.5%;transition:transform .16s}.card:first-child{margin-left:0}#hand .card:hover,#hand .card.selected{transform:translateY(-24px) scale(1.08);z-index:10;border-color:#ffe69c}
#actions{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;pointer-events:auto}
#actions button{background:#382447;color:#f3ddff;border-color:#816395}#actions button.primary{background:#7cefc4;color:#24152f}
#hint{position:absolute;bottom:230px;left:50%;transform:translateX(-50%);text-align:center;background:#10081cbb;border-radius:100px;padding:8px 15px;color:#d6f8df;white-space:nowrap;font-size:13px}
#dropzones{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);display:flex;gap:20px;pointer-events:none}
.zone{width:110px;height:125px;border:2px dashed #8edbbb66;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fffddd99;background:#190e2a5c;pointer-events:auto;transition:background .2s}
.zone.over{border-color:#fff0a7;background:#8c55a477}
#notice{position:absolute;top:82px;left:50%;transform:translateX(-50%);background:#4d264b;padding:9px 16px;max-width:70%;border-radius:12px;pointer-events:none;text-align:center;font-size:13px}
#bigCard{position:absolute;top:23%;left:50%;transform:translateX(-50%);display:none;pointer-events:none;align-items:center;flex-direction:column;gap:10px;background:#150a21e8;border:2px solid #7deec2;padding:18px;border-radius:20px;box-shadow:0 20px 50px #000c}
#bigCard.show{display:flex}#bigArt{width:230px;height:320px;border:3px solid #afffd8;border-radius:13px;background-repeat:no-repeat;background-size:333.333% 337.5%}#bigCard span{font-weight:900}
#lobby{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(420px,92vw);padding:24px;display:grid;gap:10px}#lobby.hidden{display:none}#lobby h2{margin:0;color:#9cffd8;font-size:25px}input,select{color:#fff;background:#21102e;border:1px solid #906db2;border-radius:9px;padding:10px;width:100%}label{font-size:12px;color:#d9c9e0}
#settings{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
#settings input{width:70px}#settings select{width:90px}
#response{position:absolute;top:15%;right:14px;width:260px;max-height:60vh;overflow:auto;display:none}#response.show{display:block}#response select{margin-top:7px}
#response button{width:100%;margin-top:6px}
#cursors{position:absolute;inset:0;pointer-events:none}.cursor{position:absolute;transform:translate(3px,3px);font-size:12px;background:#51b9a0;color:#170c24;padding:4px 8px;border-radius:8px;white-space:nowrap}
#trapInfo{position:absolute;left:14px;bottom:240px;max-width:235px;font-size:12px;color:#ddd0e9}
#modeButton{position:absolute;right:14px;top:82px;pointer-events:auto}
@media(max-width:800px){#status{top:65px;width:150px;font-size:12px}#topbar{left:7px;right:7px}#topbar h1{font-size:13px}#topbar button{padding:5px 7px;font-size:12px}#bottom{bottom:0}#hand{height:130px}#hand .card{width:87px;min-width:87px;height:121px;margin-left:-8px}#actions button{padding:6px 8px;font-size:12px}#hint{bottom:170px;font-size:11px}#bigArt{width:145px;height:202px}#bigCard{top:19%;padding:9px}#response{top:80px;right:6px;width:190px}#dropzones{top:53%}.zone{width:82px;height:96px}#trapInfo{bottom:165px}#modeButton{top:65px}}
</style></head><body><canvas id="view"></canvas><div id="hud">
<div id="topbar" class="panel"><div class="row"><h1>✦ 차원대충돌! 3D</h1><span id="roundInfo">게임 대기 중</span></div><div class="row"><button class="secondary" id="copy">초대 링크</button><button class="secondary" id="flat">2D로 돌아가기</button></div></div>
<div id="status" class="panel">플레이어 대기 중</div><button id="modeButton" class="secondary">E · 자리 앉기</button>
<div id="notice">WASD 이동 · 마우스로 시점 · E 앉기 / 일어나기</div>
<div id="dropzones"><div class="zone" id="playZone" data-zone="play">카드 사용 ↑</div><div class="zone" id="trapZone" data-zone="trap">내 함정 설치</div></div>
<div id="cursors"></div><div id="trapInfo"></div>
<div id="bigCard"><span id="bigLabel"></span><div id="bigArt"></div></div>
<div id="response" class="panel"></div>
<div id="bottom"><div id="hand"></div><div id="actions"><button id="draw" class="primary">덱에서 1장 뽑기</button><button id="next">턴 종료</button><button id="viewCard">카드 확대</button><button id="field">필드 설치</button><button id="grave">묘지로</button><button id="win">아마겟돈!</button></div></div>
<div id="lobby" class="panel"><h2>✦ 우주 테이블 로비</h2><p class="muted">WASD로 돌아다니다가 테이블에 앉아 카드게임을 시작하세요. 혼자라면 AI를 추가할 수 있어요.</p><label>닉네임</label><input id="name" placeholder="플레이어 이름" maxlength="20"><button id="create">새 게임방 만들기</button><label>6자리 방 코드</label><input id="roomcode" placeholder="예: AB1234"><button id="join">방 입장</button><div id="settings" style="display:none"><label>총 바퀴</label><input id="rounds" value="5" type="number" min="1" max="100"><button id="saveRounds">설정</button><label>AI</label><select id="botCount"><option value="1">1명</option><option value="2">2명</option><option value="3">3명</option></select><button id="addBot">AI 추가</button><button id="removeBot" class="secondary">AI 제거</button><button id="start" class="primary">게임 시작</button><button id="exitLobby" class="secondary">테이블 둘러보기</button></div></div>
</div><script src="/socket.io/socket.io.js"></script><script type="module">
import * as THREE from '/vendor/three.module.js';
const $=id=>document.getElementById(id),socket=io(),scene=new THREE.Scene();scene.background=new THREE.Color('#160e24');scene.fog=new THREE.Fog('#160e24',18,40);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,120),renderer=new THREE.WebGLRenderer({canvas:$('view'),antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
scene.add(new THREE.HemisphereLight(0xd4c3ff,0x392453,2.1));const light=new THREE.PointLight(0x72f8c4,65,15);light.position.set(0,6,0);scene.add(light);
function mesh(geo,col,rough=.7){return new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:col,roughness:rough,metalness:.08}))}
function box(x,y,z,w,h,d,col){const o=mesh(new THREE.BoxGeometry(w,h,d),col);o.position.set(x,y,z);scene.add(o);return o}
box(0,-.12,0,40,.2,40,0x21182d);
const grid=new THREE.GridHelper(28,28,0x6c526e,0x352641);grid.position.y=.02;scene.add(grid);
const table=mesh(new THREE.CylinderGeometry(3.75,3.75,.25,72),0x382147);table.position.y=1.16;scene.add(table);
const edge=mesh(new THREE.TorusGeometry(3.66,.075,14,72),0x84edc7);edge.rotation.x=Math.PI/2;edge.position.y=1.31;scene.add(edge);
const center=mesh(new THREE.TorusGeometry(1.2,.055,12,70),0x8853c1);center.rotation.x=Math.PI/2;center.position.y=1.32;scene.add(center);
const pole=mesh(new THREE.CylinderGeometry(.75,1.1,1.05,32),0x231831);pole.position.y=.54;scene.add(pole);
for(let i=0;i<8;i++){const a=i*Math.PI/4,x=Math.sin(a)*4.4,z=Math.cos(a)*4.4;const chair=mesh(new THREE.BoxGeometry(.95,.18,.95),0x543866);chair.position.set(x,.75,z);chair.rotation.y=a;scene.add(chair);const back=mesh(new THREE.BoxGeometry(1.05,1.05,.18),0x644776);back.position.set(Math.sin(a)*4.9,1.25,Math.cos(a)*4.9);back.rotation.y=a;scene.add(back);}
const deckMesh=mesh(new THREE.BoxGeometry(.58,.11,.84),0x88f8bf);deckMesh.position.set(-1.4,1.34,0);deckMesh.rotation.y=.2;scene.add(deckMesh);
const graveMesh=mesh(new THREE.BoxGeometry(.58,.11,.84),0x9963c5);graveMesh.position.set(1.4,1.34,0);scene.add(graveMesh);
const marker=mesh(new THREE.CylinderGeometry(.32,.32,.04,32),0xffd18c);marker.position.set(0,1.38,0);scene.add(marker);
const me={x:0,z:7.2,angle:Math.PI,seat:false,ready:false};let state=null,selected=null,currentCode=null,players={},lastAvatar=0,lastCursor=0,latestShow=null;
const avatars=new Map(),key=new Set();let draggingId=null;
const saved=()=>{try{return JSON.parse(localStorage.getItem('clash-session')||'null')}catch{return null}};
const persist=(r,name)=>{localStorage.setItem('clash-session',JSON.stringify({code:r.code,token:r.token,name}));currentCode=r.code;history.replaceState(null,'','?room='+r.code)};
function send(event,data={}){socket.emit(event,data,r=>{if(!r?.ok){$('notice').textContent='⚠ '+r?.error;return}if((event==='create'||event==='join')&&r?.code){persist(r,$('name').value);$('notice').textContent='입장 완료 · 테이블로 이동할 수 있어요'}else if(event!=='avatar')$('notice').textContent='✓ '+event+' 처리 완료'})}
function cardStyle(id){const n=Number(id)-1;return 'background-image:url(/sheets/'+String(Math.ceil(Number(id)/9)).padStart(2,'0')+'.png);background-position:'+([5.78,50,94.2][n%3])+'% '+([6.94,50,93.08][Math.floor(n%9/3)])+'%;';}
function large(card,player='카드 사용'){if(!card)return;$('bigLabel').textContent=player+' · '+card.name;$('bigArt').style.cssText=cardStyle(card.id);$('bigCard').classList.add('show');clearTimeout(large.timer);large.timer=setTimeout(()=>$('bigCard').classList.remove('show'),3300)}
function avatar(p){let a=avatars.get(p.id);if(!a){a=new THREE.Group();const body=mesh(new THREE.CylinderGeometry(.26,.33,1,14),p.bot?0x8b82d1:0x55bb9e);body.position.y=.8;a.add(body);const head=mesh(new THREE.SphereGeometry(.24,16,12),p.bot?0xe4b6ff:0xffd3aa);head.position.y=1.54;a.add(head);scene.add(a);avatars.set(p.id,a)}a.position.set(p.x,0,p.z);a.rotation.y=p.angle||0;}
function seatPosition(){const n=state?.players.findIndex(p=>p.id===state.me)??0;const a=n*2*Math.PI/Math.max(2,state?.players.length||2);return {x:Math.sin(a)*4.4,z:Math.cos(a)*4.4,angle:a}}
function render(){if(!state)return;
 $('status').innerHTML='<b>✦ 테이블 참가자</b>'+state.players.map((p,i)=>'<div class="user">'+(i===state.turn?'🟢 ':'')+(p.bot?'🤖 ':'')+esc(p.name)+(p.id===state.me?' (나)':'')+' · 손패 '+p.count+' · 함정 '+p.traps+'</div>').join('');
 $('roundInfo').textContent=(state.status==='playing'?'남은 바퀴 '+state.left+'/'+state.rounds+' · '+state.players[state.turn]?.name+' 차례':state.status==='finished'?'게임 종료':'대기실 · '+(state.code||''));
 $('settings').style.display=state.status==='lobby'?'flex':'none';$('lobby').classList.toggle('hidden',state.status!=='lobby');
 $('start').disabled=state.owner!==state.me;$('addBot').disabled=state.owner!==state.me;$('removeBot').disabled=state.owner!==state.me;
 $('saveRounds').disabled=state.owner!==state.me;
 const old=selected;$('hand').replaceChildren();
 for(const c of state.hand){const div=document.createElement('button');div.className='card';div.title=c.name;div.draggable=true;div.dataset.id=c.id;div.style.cssText=cardStyle(c.id);if(c.id===old)div.classList.add('selected');div.onclick=()=>{selected=c.id;render();};div.ondblclick=()=>large(c,'내 카드');div.ondragstart=e=>{draggingId=c.id;e.dataTransfer.setData('text/plain',c.id);};$('hand').appendChild(div)}
 $('draw').disabled=state.status!=='playing'||state.players[state.turn]?.id!==state.me;$('next').disabled=state.status!=='playing'||state.players[state.turn]?.id!==state.me;$('win').disabled=state.hand.length<10;
 const trap=state.myTraps||[];$('trapInfo').textContent='내 함정: '+(trap.length?trap.map(c=>c.name).join(', '):'없음');
 for(const p of state.players){avatar(p);if(p.id===state.me){me.seat=p.seated;if(!me.ready){me.x=p.x;me.z=p.z;me.ready=true}}}
 if(state.showcase && state.showcase.at!==latestShow){latestShow=state.showcase.at;const c=state.catalog.find(x=>x.id===state.showcase.cardId);large(c,state.showcase.actorName+' 사용');}
 drawReactions();
}
function esc(s){return String(s).replace(/[&<>"]/g,t=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[t]))}
function drawReactions(){const w=state?.pending,r=$('response');r.classList.toggle('show',!!w);if(!w)return;r.replaceChildren();const title=document.createElement('b');title.textContent='⚡ '+w.stack?.at(-1)?.cardName+' 대응';r.appendChild(title);const p=document.createElement('p');p.className='muted';const priority=w.stage==='responding'?w.order[w.cursor]:null;p.textContent=w.stage==='ready'?'카드 효과 처리 대기':state.players.find(x=>x.id===priority)?.name+'님의 대응 순서';r.appendChild(p);
function button(label,cb){const b=document.createElement('button');b.textContent=label;b.onclick=cb;r.appendChild(b)}
if(w.stage==='responding'&&priority===state.me){button('반응 없음 · 패스',()=>send('react',{choice:'pass'}));if(state.hand.length||state.myTraps.length){const select=document.createElement('select');select.id='counterChoice';for(const c of [...state.hand,...state.myTraps]){const o=document.createElement('option');o.value=c.id;o.textContent=c.name;select.appendChild(o)}r.appendChild(select);button('대응 카드 선언',()=>send('react',{choice:'counter',cardId:select.value}))}}
if(w.stage==='ready'&&w.stack.at(-1)?.actorId===state.me)button('효과 확인 후 해결',()=>send('resolve'));
}
socket.on('connect',()=>{const session=saved();if(session){$('name').value=session.name;socket.emit('join',session,res=>{if(res?.ok)persist(res,session.name);else $('notice').textContent='기존 방 재접속 실패 · 새 방을 만들거나 입장하세요'})}});
socket.on('state',s=>{state=s;currentCode=s.code;render()});
socket.on('avatar',p=>{const a=avatars.get(p.id);if(a){a.position.set(p.x,0,p.z);a.rotation.y=p.angle}});
socket.on('cursor',p=>{if(p.id===state?.me)return;let v=$('cursor_'+p.id);if(!v){v=document.createElement('div');v.id='cursor_'+p.id;v.className='cursor';$('cursors').appendChild(v)}v.textContent='↖ '+p.name;v.style.left=(p.x*100)+'%';v.style.top=(p.y*100)+'%'});
$('create').onclick=()=>send('create',{name:$('name').value});$('join').onclick=()=>send('join',{code:$('roomcode').value,name:$('name').value});
$('roomcode').value=new URLSearchParams(location.search).get('room')||'';$('copy').onclick=()=>navigator.clipboard.writeText(location.origin+'/room3d.html?room='+currentCode).then(()=>$('notice').textContent='초대 링크 복사 완료');
$('saveRounds').onclick=()=>send('rounds',{count:+$('rounds').value});$('addBot').onclick=()=>send('addBot',{count:+$('botCount').value});$('removeBot').onclick=()=>send('removeBot');
$('start').onclick=()=>send('start');$('exitLobby').onclick=()=>$('lobby').classList.add('hidden');$('flat').onclick=()=>location.href='/?room='+(currentCode||'');
$('draw').onclick=()=>send('draw',{count:1});$('next').onclick=()=>send('next');$('win').onclick=()=>send('declare');
$('viewCard').onclick=()=>large(state?.hand.find(x=>x.id===selected),'내 카드');
$('field').onclick=()=>moveSelected('field');$('grave').onclick=()=>moveSelected('discard');
function moveSelected(destination){if(!selected)return $('notice').textContent='손패를 먼저 선택하세요';const c=state.hand.find(x=>x.id===selected);if(destination==='field'&&c.type!=='field')return $('notice').textContent='필드에는 필드카드만 둘 수 있습니다';if(destination==='trap'&&c.type!=='trap')return $('notice').textContent='함정 구역에는 함정카드만 둘 수 있습니다';send('move',{cardId:selected,destination});selected=null}
function playSelected(id){const c=state?.hand.find(x=>x.id===id);if(!c)return;if(c.type==='field')return moveSelected('field');if(c.type==='trap')return moveSelected('trap');send('announce',{cardId:id});}
for(const z of document.querySelectorAll('.zone')){z.ondragover=e=>{e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');z.ondrop=e=>{e.preventDefault();z.classList.remove('over');const id=e.dataTransfer.getData('text/plain')||draggingId;selected=id;if(z.dataset.zone==='trap')moveSelected('trap');else playSelected(id)};z.onclick=()=>{if(z.dataset.zone==='trap')moveSelected('trap');else if(selected)playSelected(selected)}}
function toggleSeat(){if(!state)return;const pos=seatPosition();if(me.seat){send('sit',{sit:false});me.seat=false;me.x=pos.x*1.5;me.z=pos.z*1.5;return}if(Math.hypot(me.x-pos.x,me.z-pos.z)>3.4){$('notice').textContent='내 자리 쪽으로 WASD 이동한 후 E를 누르세요';return}send('sit',{sit:true});me.seat=true;me.x=pos.x;me.z=pos.z}
$('modeButton').onclick=toggleSeat;
window.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;key.add(e.key.toLowerCase());if(e.key.toLowerCase()==='e'&&!e.repeat)toggleSeat()});
window.addEventListener('keyup',e=>key.delete(e.key.toLowerCase()));
const clock=new THREE.Clock();let yaw=0;window.addEventListener('mousemove',e=>{if(e.buttons===2){yaw+=e.movementX*.004}if(state&&performance.now()-lastCursor>65){lastCursor=performance.now();socket.emit('cursor',{x:e.clientX/innerWidth,y:e.clientY/innerHeight})}});
$('view').oncontextmenu=e=>e.preventDefault();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);const dt=Math.min(.05,clock.getDelta());if(!me.seat&&state){const vx=Number(key.has('d'))-Number(key.has('a')),vz=Number(key.has('s'))-Number(key.has('w'));if(vx||vz){const len=Math.hypot(vx,vz),dx=(Math.cos(yaw)*vx+Math.sin(yaw)*vz)/len*dt*3.8,dz=(-Math.sin(yaw)*vx+Math.cos(yaw)*vz)/len*dt*3.8;const nx=Math.max(-11,Math.min(11,me.x+dx)),nz=Math.max(-11,Math.min(11,me.z+dz));if(Math.hypot(nx,nz)>3.35){me.x=nx;me.z=nz}if(performance.now()-lastAvatar>90){lastAvatar=performance.now();socket.emit('avatar',{x:me.x,z:me.z,angle:yaw})}}}
 const target=new THREE.Vector3(0,1.2,0);
 if(me.seat){const pos=seatPosition();const origin=new THREE.Vector3(pos.x*1.12,2.45,pos.z*1.12);camera.position.lerp(origin,.10);camera.lookAt(target);}else{const pos=new THREE.Vector3(me.x,2.2,me.z);camera.position.lerp(pos,.12);camera.lookAt(me.x+Math.sin(yaw)*4,1.75,me.z-Math.cos(yaw)*4);}
 if(state){const p=avatars.get(state.me);if(p){p.position.set(me.x,0,me.z);p.visible=!me.seat}}
 renderer.render(scene,camera)}
animate();
</script></body></html>
